name: Build aural-engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, feat/vrm-character-preview-v1, feat/vrm-timeline-mp4-export-v1 ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pybind11 "PySide6>=6.12,<6.13" "PySide6-WebEngine>=6.12,<6.13" numpy pytest Pillow python-osc websockets

      - name: Setup vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg install ffmpeg:x64-windows

      - name: Configure CMake
        run: cmake -B build "-DCMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aural-engine-windows
          path: |
            build/Release/*.exe
            build/Release/*.pyd
            python/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pybind11 "PySide6>=6.12,<6.13" "PySide6-WebEngine>=6.12,<6.13" numpy pytest Pillow python-osc websockets

      - name: Install dependencies
        run: brew install ffmpeg

      - name: Configure CMake
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aural-engine-macos
          path: |
            build/aural-engine
            build/aural-compose
            build/aural_engine*.so
            python/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pybind11 "PySide6>=6.12,<6.13" "PySide6-WebEngine>=6.12,<6.13" numpy pytest Pillow python-osc websockets

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libavfilter-dev \
            libswscale-dev \
            ffmpeg \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgl1 \
            libegl1 \
            libpulse0 \
            libnss3 \
            libnspr4 \
            libcups2 \
            libgtk-3-0 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libatspi2.0-0 \
            libgbm1 \
            libdrm2 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-xinerama0 \
            libxcb-dri3-0 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxrandr2 \
            libxkbfile1 \
            libxtst6 \
            libxshmfence1
          if apt-cache show libasound2t64 >/dev/null 2>&1; then
            sudo apt-get install -y libasound2t64
          else
            sudo apt-get install -y libasound2
          fi

      - name: Configure CMake
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aural-engine-linux
          path: |
            build/aural-engine
            build/aural-compose
            build/aural_engine*.so
            python/
