name: Project Core Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, feat/project-core-v1, feat/timeline-core-v1, feat/timeline-playback-v1, feat/timeline-audio-v1, feat/generated-audio-assets-v1, feat/timeline-audio-mix-controls-v1, feat/timeline-audio-render-v1, feat/timeline-audio-video-export-v1 ]

jobs:
  python-tests:
    name: Python tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest PySide6 numpy Pillow python-osc

      - name: Compile Python sources
        run: python -m compileall -q python tests

      - name: Run project and application tests
        run: python -m pytest -q
