name: Package Axral Cut Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/vrm-timeline-mp4-export-v1]
  workflow_dispatch:

permissions:
  contents: read

# Avoid spending runners on obsolete package builds after a newer PR commit arrives.
concurrency:
  group: axral-cut-studio-package-${{ github.ref }}
  cancel-in-progress: true

env:
  AXRAL_PACKAGE_VERSION: 0.1.${{ github.run_number }}

jobs:
  package:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build offline VRM viewer
        working-directory: web/vrm_viewer
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt pybind11 pyinstaller

      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          # The library features alone do not install the ffmpeg/ffprobe CLI binaries.
          .\vcpkg\vcpkg install "ffmpeg[ffmpeg,ffprobe]:x64-windows"
          $toolDir = "$PWD\vcpkg\installed\x64-windows\tools\ffmpeg"
          $ffmpegExe = Join-Path $toolDir "ffmpeg.exe"
          $ffprobeExe = Join-Path $toolDir "ffprobe.exe"
          if (!(Test-Path $ffmpegExe) -or !(Test-Path $ffprobeExe)) {
            throw "vcpkg did not install ffmpeg.exe and ffprobe.exe under $toolDir"
          }
          $toolDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$toolDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$PWD\vcpkg\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          choco install innosetup --yes --no-progress

      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config dpkg-dev ffmpeg \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev libswscale-dev \
            libgl1-mesa-dev libglu1-mesa-dev libgl1 libegl1 libpulse0 \
            libnss3 libnspr4 libcups2 libgtk-3-0 libatk1.0-0 \
            libatk-bridge2.0-0 libatspi2.0-0 libgbm1 libdrm2 \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 \
            libxcb-dri3-0 libx11-xcb1 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxrandr2 libxkbfile1 libxtst6 libxshmfence1 fonts-noto-cjk
          if apt-cache show libasound2t64 >/dev/null 2>&1; then
            sudo apt-get install -y libasound2t64
          else
            sudo apt-get install -y libasound2
          fi

      - name: Configure Windows native build
        if: runner.os == 'Windows'
        run: cmake -B build "-DCMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Configure macOS and Linux native build
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build native targets
        run: cmake --build build --config Release --parallel

      - name: Run regression tests
        run: python -m pytest -q

      - name: Build and smoke-test application packages
        run: python scripts/package_application.py

      - name: Upload distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: AxralCutStudio-${{ matrix.platform }}-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
